services:
  api:
    build: .
    container_name: task_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:dev@db:5432/tasks
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: taskdb
    environment:
      - POSTGRES_DB=tasks
      - POSTGRES_PASSWORD=dev
    ports:
      - "5432:5432"
    volumes:
      - taskdata:/var/lib/postgresql/data

volumes:
  taskdata:
